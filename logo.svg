<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Garage Ahmeti Mécanique
       Symbolism without flags: the Alps (Switzerland) under six stars (Kosovo),
       a small red cross as the crest, and a sports car on the road home. -->
  <defs>
    <style>
      @font-face { font-family: 'Montserrat'; font-weight: 300 600; src: url(data:font/woff2;base64,) format('woff2'); }
      text { font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; }
    </style>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A8A90"/>
      <stop offset="1" stop-color="#2A2A2E"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <path id="shield" d="M330,160 H670 V360 Q670,500 500,585 Q330,500 330,360 Z"/>
    <clipPath id="inside"><use href="#shield" transform="translate(500,370) scale(0.93) translate(-500,-370)"/></clipPath>
  </defs>

  <rect width="1000" height="1000" fill="#0B0B0C"/>

  <!-- Scene inside the shield -->
  <g clip-path="url(#inside)">
    <g fill="#FFFFFF">
    <polygon points="418.0,221.0 419.7,225.6 424.7,225.8 420.8,228.9 422.1,233.7 418.0,230.9 413.9,233.7 415.2,228.9 411.3,225.8 416.3,225.6"/>
    <polygon points="450.8,210.8 452.5,215.4 457.5,215.6 453.6,218.7 454.9,223.4 450.8,220.7 446.7,223.4 448.0,218.7 444.1,215.6 449.1,215.4"/>
    <polygon points="483.6,205.6 485.3,210.3 490.3,210.5 486.4,213.5 487.7,218.3 483.6,215.6 479.5,218.3 480.8,213.5 476.9,210.5 481.9,210.3"/>
    <polygon points="516.4,205.6 518.1,210.3 523.1,210.5 519.2,213.5 520.5,218.3 516.4,215.6 512.3,218.3 513.6,213.5 509.7,210.5 514.7,210.3"/>
    <polygon points="549.2,210.8 550.9,215.4 555.9,215.6 552.0,218.7 553.3,223.4 549.2,220.7 545.1,223.4 546.4,218.7 542.5,215.6 547.5,215.4"/>
    <polygon points="582.0,221.0 583.7,225.6 588.7,225.8 584.8,228.9 586.1,233.7 582.0,230.9 577.9,233.7 579.2,228.9 575.3,225.8 580.3,225.6"/>
    </g>

    <!-- Alps -->
    <g transform="translate(20,0)">
      <clipPath id="mtnClip"><path d="M300,470 L300,420 L400,330 L430,355 L480,268 L560,380 L600,330 L700,420 L700,470 Q610,500 510,452 Q420,420 300,470 Z"/></clipPath>
      <path fill="url(#mtn)" d="M300,470 L300,420 L400,330 L430,355 L480,268 L560,380 L600,330 L700,420 L700,470 Q610,500 510,452 Q420,420 300,470 Z" stroke="none" stroke-width="2" stroke-linejoin="round"/>
      <!-- shadowed faces -->
      <g clip-path="url(#mtnClip)">
      <path fill="#0B0B0C" fill-opacity="0.28" d="M480,268 L560,380 L540,480 L505,480 L492,360 Z"/>
      <path fill="#0B0B0C" fill-opacity="0.28" d="M600,330 L700,420 L700,480 L640,480 L612,380 Z"/>
      <path fill="#0B0B0C" fill-opacity="0.28" d="M400,330 L430,355 L440,480 L420,480 L408,370 Z"/>
      </g>
      <!-- snow caps -->
      <g fill="#FFFFFF">
        <path d="M480,268 L510,310 L498,304 L489,318 L478,302 L468,312 L458,306 Z"/>
        <path d="M600,330 L619,352 L609,348 L601,358 L593,347 L582,352 Z"/>
        <path d="M400,330 L421,348 L412,346 L404,354 L396,345 L385,350 Z"/>
      </g>
    </g>

    <!-- Winding road -->
    <path fill="url(#road)" d="M512,432 C500,455 450,470 448,505 C446,535 478,555 462,610 L572,610 C572,560 510,545 500,510 C490,475 520,455 524,432 Z"/>
    <path fill="none" stroke="#0B0B0C" stroke-width="3" stroke-dasharray="7 7"
          d="M518,436 C510,458 468,472 474,507 C480,540 522,552 518,610"/>
  </g>

  <!-- Shield frame -->
  <use href="#shield" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
  <use href="#shield" fill="none" stroke="#FFFFFF" stroke-width="1.5" transform="translate(500,370) scale(0.93) translate(-500,-370)"/>

  <!-- Red cross crest, cut into the frame -->
  <g fill="#C8102E" stroke="#0B0B0C" stroke-width="8" paint-order="stroke">
    <path d="M492,140 H508 V152 H520 V168 H508 V180 H492 V168 H480 V152 H492 Z"/>
  </g>

  <!-- Speed lines -->
  <g stroke="#FFFFFF" stroke-linecap="round">
    <line x1="200" y1="590" x2="272" y2="590" stroke-width="4"/>
    <line x1="228" y1="604" x2="278" y2="604" stroke-width="4"/>
    <line x1="252" y1="618" x2="282" y2="618" stroke-width="4"/>
  </g>

  <!-- Sports car breaking out of the shield -->
  <path d="M292,612 C292,596 300,588 330,584 L390,576 C430,552 470,540 520,538 C575,536 610,548 648,570 C690,574 712,584 716,598 L718,612 C718,618 714,620 708,620 L668,620 A29,29 0 0 0 610,620 L400,620 A29,29 0 0 0 342,620 L300,620 C294,620 292,617 292,612 Z" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="10" stroke-linejoin="round" paint-order="stroke"/>
  <g fill="#0B0B0C">
    <path d="M404,574 C440,556 472,550 512,549 L512,574 Z"/>
    <path d="M522,549 C566,549 594,558 620,572 L622,574 L522,574 Z"/>
  </g>
  <path d="M312,598 C450,592 600,592 704,598" fill="none" stroke="#C8102E" stroke-width="3.5" stroke-linecap="round"/>
  <g>
    <circle cx="371" cy="620" r="24" fill="#0B0B0C" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="371" cy="620" r="12" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="371" cy="620" r="4" fill="#FFFFFF"/>
    <circle cx="639" cy="620" r="24" fill="#0B0B0C" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="639" cy="620" r="12" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="639" cy="620" r="4" fill="#FFFFFF"/>
  </g>
  <line x1="300" y1="650" x2="720" y2="650" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Name -->
  <text x="500" y="760" text-anchor="middle" font-size="96" font-weight="600" letter-spacing="28" dx="14" fill="#FFFFFF">AHMETI</text>
  <line x1="260" y1="805" x2="470" y2="805" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="493" y="798" width="14" height="14" fill="#C8102E" transform="rotate(45 500 805)"/>
  <line x1="530" y1="805" x2="740" y2="805" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="500" y="860" text-anchor="middle" font-size="25" font-weight="300" letter-spacing="12" dx="6" fill="#FFFFFF">GARAGE · MÉCANIQUE</text>
</svg>
