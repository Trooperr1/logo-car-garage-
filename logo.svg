<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <style>
      @font-face { font-family: 'Cinzel'; font-weight: 900; src: url(data:font/woff2;base64,) format('woff2'); }
      @font-face { font-family: 'Montserrat'; font-weight: 500; src: url(data:font/woff2;base64,) format('woff2'); }
      .title { font-family: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif; font-weight: 900; }
      .sub   { font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; }
    </style>

    <!-- Metallic gold -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFF1B8"/>
      <stop offset="0.22" stop-color="#E9C66A"/>
      <stop offset="0.5"  stop-color="#B8862F"/>
      <stop offset="0.72" stop-color="#F3D98A"/>
      <stop offset="1"    stop-color="#9C6E1E"/>
    </linearGradient>
    <linearGradient id="goldH" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="850" y2="0">
      <stop offset="0"    stop-color="#9C6E1E"/>
      <stop offset="0.3"  stop-color="#F3D98A"/>
      <stop offset="0.5"  stop-color="#FFF1B8"/>
      <stop offset="0.7"  stop-color="#E0B85A"/>
      <stop offset="1"    stop-color="#9C6E1E"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#1c1c1f"/>
      <stop offset="1" stop-color="#060607"/>
    </radialGradient>
    <!-- Deep flag tones for a premium look -->
    <linearGradient id="swissRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4322B"/>
      <stop offset="1" stop-color="#8E1510"/>
    </linearGradient>
    <linearGradient id="kosovoBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F5BC4"/>
      <stop offset="1" stop-color="#132C70"/>
    </linearGradient>

    <path id="shield" d="M360,150 H640 V330 Q640,445 500,500 Q360,445 360,330 Z"/>
    <clipPath id="shieldClip"><use href="#shield"/></clipPath>

    <polygon id="star" points="0,-9 2.1,-2.9 8.6,-2.8 3.4,1.1 5.3,7.3 0,3.6 -5.3,7.3 -3.4,1.1 -8.6,-2.8 -2.1,-2.9"/>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bg)"/>

  <!-- Outer rings -->
  <circle cx="500" cy="500" r="468" fill="none" stroke="url(#gold)" stroke-width="10"/>
  <circle cx="500" cy="500" r="448" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <circle cx="500" cy="500" r="440" fill="none" stroke="#E9C66A" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 6"/>

  <!-- Crown of three stars -->
  <g fill="url(#gold)">
    <use href="#star" transform="translate(455,112) scale(1.1)"/>
    <use href="#star" transform="translate(500,100) scale(1.5)"/>
    <use href="#star" transform="translate(545,112) scale(1.1)"/>
  </g>

  <!-- Shield: Switzerland | Kosovo -->
  <g clip-path="url(#shieldClip)">
    <rect x="360" y="150" width="140" height="360" fill="url(#swissRed)"/>
    <rect x="500" y="150" width="140" height="360" fill="url(#kosovoBlue)"/>

    <!-- Swiss cross -->
    <g fill="#FFFFFF">
      <rect x="395" y="277" width="70" height="22"/>
      <rect x="419" y="253" width="22" height="70"/>
    </g>

    <!-- Kosovo: six stars over the golden map -->
    <g fill="#FFFFFF">
      <use href="#star" transform="translate(527,238) scale(0.8)"/>
      <use href="#star" transform="translate(545,226) scale(0.8)"/>
      <use href="#star" transform="translate(563,220) scale(0.8)"/>
      <use href="#star" transform="translate(581,220) scale(0.8)"/>
      <use href="#star" transform="translate(599,226) scale(0.8)"/>
      <use href="#star" transform="translate(617,238) scale(0.8)"/>
    </g>
    <path fill="url(#gold)" transform="translate(572,300) scale(1.25)"
          d="M-6,-38 L4,-33 L10,-24 L20,-18 L22,-8 L31,-2 L30,8 L22,14
             L17,24 L8,28 L3,37 L-6,40 L-12,33 L-21,27 L-24,16 L-33,10
             L-35,-2 L-28,-10 L-26,-22 L-16,-26 L-12,-35 Z"/>

    <!-- Gloss highlight -->
    <path d="M360,150 H640 V210 Q500,250 360,210 Z" fill="#FFFFFF" fill-opacity="0.08"/>
  </g>
  <!-- Shield border + divider -->
  <line x1="500" y1="150" x2="500" y2="500" stroke="url(#gold)" stroke-width="3"/>
  <use href="#shield" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linejoin="round"/>
  <use href="#shield" fill="none" stroke="#0a0a0b" stroke-width="1.5" transform="translate(500,325) scale(0.955) translate(-500,-325)"/>

  <!-- Sports car silhouette -->
  <g transform="translate(0,-8)">
    <!-- speed lines -->
    <g stroke="url(#goldH)" stroke-linecap="round">
      <line x1="150" y1="598" x2="245" y2="598" stroke-width="3"/>
      <line x1="175" y1="614" x2="250" y2="614" stroke-width="3"/>
      <line x1="200" y1="630" x2="252" y2="630" stroke-width="3"/>
    </g>
    <!-- body -->
    <path fill="url(#gold)" stroke="#0a0a0b" stroke-width="2"
          d="M262,640 L262,614 Q266,594 300,588 L372,578
             Q432,550 490,544 Q556,540 604,558 L652,579
             Q720,582 738,598 Q748,608 746,630 L744,640
             L690,640 A40,40 0 0 0 610,640
             L390,640 A40,40 0 0 0 310,640 Z"/>
    <!-- windows -->
    <path fill="#0d0d0f" d="M398,578 Q440,558 486,554 L486,578 Z"/>
    <path fill="#0d0d0f" d="M496,553 Q552,551 584,564 L604,578 L496,578 Z"/>
    <!-- body crease -->
    <path d="M300,602 Q500,594 728,604" fill="none" stroke="#0a0a0b" stroke-opacity="0.45" stroke-width="2"/>
    <!-- wheels -->
    <g>
      <circle cx="350" cy="640" r="33" fill="#0d0d0f" stroke="url(#gold)" stroke-width="6"/>
      <circle cx="350" cy="640" r="16" fill="none" stroke="url(#gold)" stroke-width="3"/>
      <circle cx="350" cy="640" r="5" fill="url(#gold)"/>
      <circle cx="650" cy="640" r="33" fill="#0d0d0f" stroke="url(#gold)" stroke-width="6"/>
      <circle cx="650" cy="640" r="16" fill="none" stroke="url(#gold)" stroke-width="3"/>
      <circle cx="650" cy="640" r="5" fill="url(#gold)"/>
    </g>
    <!-- road -->
    <line x1="230" y1="682" x2="770" y2="682" stroke="url(#goldH)" stroke-width="2"/>
  </g>

  <!-- Name -->
  <text x="500" y="770" text-anchor="middle" class="title" font-size="76" letter-spacing="6" fill="url(#gold)">AUTO GARAGE</text>

  <!-- Divider with flag dots -->
  <g>
    <line x1="290" y1="805" x2="470" y2="805" stroke="url(#goldH)" stroke-width="2"/>
    <line x1="530" y1="805" x2="710" y2="805" stroke="url(#goldH)" stroke-width="2"/>
    <circle cx="487" cy="805" r="7" fill="#D52B1E" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="513" cy="805" r="7" fill="#244AA5" stroke="url(#gold)" stroke-width="2"/>
  </g>

  <text x="500" y="850" text-anchor="middle" class="sub" font-size="22" letter-spacing="9" fill="#E9C66A">SWITZERLAND · KOSOVA</text>
  <text x="500" y="890" text-anchor="middle" class="sub" font-size="15" letter-spacing="6" fill="#E9C66A" fill-opacity="0.7">PREMIUM CAR SERVICE</text>
</svg>
