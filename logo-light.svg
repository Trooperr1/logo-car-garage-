<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Garage Ahmeti Mécanique
       The Alps (Switzerland) under six stars (Kosovo), with a sports car in
       front. Red is kept to small accents: the pinstripe and the Swiss plus. -->
  <defs>
    <style>
      @font-face { font-family: 'Montserrat'; font-weight: 300 600; src: url(data:font/woff2;base64,) format('woff2'); }
      text { font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; }
    </style>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="140" y1="0" x2="860" y2="0">
      <stop offset="0" stop-color="#0B0B0C" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#0B0B0C"/>
      <stop offset="0.75" stop-color="#0B0B0C"/>
      <stop offset="1" stop-color="#0B0B0C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="#FFFFFF"/>
  <g transform="translate(0,-30)">

  <!-- Six stars -->
  <g fill="#0B0B0C">
    <polygon points="430.0,276.0 431.5,280.0 435.7,280.1 432.4,282.8 433.5,286.9 430.0,284.5 426.5,286.9 427.6,282.8 424.3,280.1 428.5,280.0"/>
    <polygon points="458.0,267.0 459.5,271.0 463.7,271.2 460.4,273.8 461.5,277.9 458.0,275.6 454.5,277.9 455.6,273.8 452.3,271.2 456.5,271.0"/>
    <polygon points="486.0,262.6 487.5,266.5 491.7,266.7 488.4,269.3 489.5,273.4 486.0,271.1 482.5,273.4 483.6,269.3 480.3,266.7 484.5,266.5"/>
    <polygon points="514.0,262.6 515.5,266.5 519.7,266.7 516.4,269.3 517.5,273.4 514.0,271.1 510.5,273.4 511.6,269.3 508.3,266.7 512.5,266.5"/>
    <polygon points="542.0,267.0 543.5,271.0 547.7,271.2 544.4,273.8 545.5,277.9 542.0,275.6 538.5,277.9 539.6,273.8 536.3,271.2 540.5,271.0"/>
    <polygon points="570.0,276.0 571.5,280.0 575.7,280.1 572.4,282.8 573.5,286.9 570.0,284.5 566.5,286.9 567.6,282.8 564.3,280.1 568.5,280.0"/>
  </g>

  <!-- Alpine ridge line -->
  <path d="M160,600 L320,452 L382,500 L500,318 L600,462 L656,414 L840,600"
        fill="none" stroke="#0B0B0C" stroke-width="4" stroke-linejoin="miter" stroke-miterlimit="10"/>
  <!-- snow lines -->
  <path d="M461,378 L480,392 L500,372 L520,394 L539,378" fill="none" stroke="#0B0B0C" stroke-width="3" stroke-linejoin="round"/>
  <path d="M298,472 L312,480 L324,468 L338,478" fill="none" stroke="#0B0B0C" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M636,434 L648,442 L660,430 L674,440" fill="none" stroke="#0B0B0C" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Sports car -->
  <path d="M262,598 C256,586 258,574 272,568 C320,548 380,520 450,508 C500,500 540,502 570,516 L606,540 C662,546 714,554 738,566 C748,572 750,586 746,598 L680,598 A34,34 0 0 0 612,598 L390,598 A34,34 0 0 0 322,598 Z" fill="#0B0B0C" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" paint-order="stroke"/>
  <g fill="#FFFFFF">
    <path d="M392,548 C430,530 466,519 500,517 L500,548 Z"/>
    <path d="M510,516 C534,516 552,522 566,530 L584,548 L510,548 Z"/>
  </g>
  <path d="M314,563 C430,556 600,556 714,565" fill="none" stroke="#C8102E" stroke-width="3.5" stroke-linecap="round"/>
  <g>
    <circle cx="356" cy="598" r="27" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="6"/>
    <circle cx="356" cy="598" r="13" fill="none" stroke="#0B0B0C" stroke-width="3"/>
    <circle cx="646" cy="598" r="27" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="6"/>
    <circle cx="646" cy="598" r="13" fill="none" stroke="#0B0B0C" stroke-width="3"/>
  </g>

  <!-- Ground -->
  <line x1="140" y1="636" x2="860" y2="636" stroke="url(#fade)" stroke-width="2"/>

  <!-- Name -->
  <text x="500" y="770" text-anchor="middle" font-size="100" font-weight="500" letter-spacing="32" dx="16" fill="#0B0B0C">AHMETI</text>
  <text x="446" y="836" text-anchor="end" font-size="24" font-weight="400" letter-spacing="12" fill="#0B0B0C">GARAGE</text>
  <text x="494" y="836" text-anchor="start" font-size="24" font-weight="400" letter-spacing="12" fill="#0B0B0C">MÉCANIQUE</text>
  <path fill="#C8102E" d="M461.0,819.0 h6.0 v6.0 h6.0 v6.0 h-6.0 v6.0 h-6.0 v-6.0 h-6.0 v-6.0 h6.0 Z"/>
  </g>
</svg>
