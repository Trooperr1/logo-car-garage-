<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Garage Ahmeti Mécanique
       Indirect symbolism: the "A" is an Alpine peak (Switzerland) with a Swiss
       plus as its crossbar; six stars above it recall Kosovo; the road line
       below turns into a car silhouette (the garage). -->
  <defs>
    <style>
      @font-face { font-family: 'Montserrat'; font-weight: 300 600; src: url(data:font/woff2;base64,) format('woff2'); }
      text { font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1000" height="1000" fill="#FFFFFF"/>

  <!-- Six stars -->
  <g fill="#0B0B0C">
    <polygon points="400.0,180.0 402.2,185.9 408.6,186.2 403.6,190.2 405.3,196.3 400.0,192.8 394.7,196.3 396.4,190.2 391.4,186.2 397.8,185.9"/>
    <polygon points="440.0,164.6 442.2,170.6 448.6,170.9 443.6,174.8 445.3,180.9 440.0,177.4 434.7,180.9 436.4,174.8 431.4,170.9 437.8,170.6"/>
    <polygon points="480.0,157.0 482.2,162.9 488.6,163.2 483.6,167.1 485.3,173.2 480.0,169.7 474.7,173.2 476.4,167.1 471.4,163.2 477.8,162.9"/>
    <polygon points="520.0,157.0 522.2,162.9 528.6,163.2 523.6,167.1 525.3,173.2 520.0,169.7 514.7,173.2 516.4,167.1 511.4,163.2 517.8,162.9"/>
    <polygon points="560.0,164.6 562.2,170.6 568.6,170.9 563.6,174.8 565.3,180.9 560.0,177.4 554.7,180.9 556.4,174.8 551.4,170.9 557.8,170.6"/>
    <polygon points="600.0,180.0 602.2,185.9 608.6,186.2 603.6,190.2 605.3,196.3 600.0,192.8 594.7,196.3 596.4,190.2 591.4,186.2 597.8,185.9"/>
  </g>

  <g transform="translate(0,20)">
  <!-- "A" as an Alpine peak, legs cut flat -->
  <defs><clipPath id="cut"><rect x="0" y="0" width="1000" height="452"/></clipPath></defs>
  <path d="M362,500 L500,200 L638,500" fill="none" stroke="#0B0B0C" stroke-width="30" stroke-linejoin="miter" stroke-miterlimit="10" clip-path="url(#cut)"/>

  <!-- Swiss plus as the A's crossbar -->
  <g fill="#C8102E">
    <rect x="474" y="372" width="52" height="16"/>
    <rect x="492" y="354" width="16" height="52"/>
  </g>

  <!-- Road line that becomes a sports car -->
  <path d="M170,560 H268
           C268,540 284,532 322,527 L398,519
           C440,493 482,482 532,482
           C578,482 610,494 646,514
           C694,520 724,530 730,548 L732,560 H830"
        fill="none" stroke="#0B0B0C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- side window -->
  <path d="M432,515 C462,500 494,494 532,494 C566,494 592,502 616,515 Z"
        fill="none" stroke="#0B0B0C" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#FFFFFF" stroke="#0B0B0C" stroke-width="7">
    <circle cx="362" cy="560" r="25"/>
    <circle cx="640" cy="560" r="25"/>
  </g>
  <g fill="#0B0B0C">
    <circle cx="362" cy="560" r="6"/>
    <circle cx="640" cy="560" r="6"/>
  </g>
  </g>

  <!-- Name -->
  <text x="500" y="725" text-anchor="middle" font-size="104" font-weight="600" letter-spacing="30" fill="#0B0B0C" dx="15">AHMETI</text>

  <line x1="250" y1="777" x2="468" y2="777" stroke="#0B0B0C" stroke-width="1.5"/>
  <rect x="493" y="770" width="14" height="14" fill="#C8102E" transform="rotate(45 500 777)"/>
  <line x1="532" y1="777" x2="750" y2="777" stroke="#0B0B0C" stroke-width="1.5"/>

  <text x="500" y="837" text-anchor="middle" font-size="26" font-weight="300" letter-spacing="13" fill="#0B0B0C" dx="6.5">GARAGE · MÉCANIQUE</text>
</svg>
